name: Runtime and startup tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.18.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
  github-install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [github, https]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      - run: npm install --global npm@11.11.0
      - name: Install and update directly from GitHub using npx
        shell: pwsh
        env:
          PACKAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PACKAGE_TRANSPORT: ${{ matrix.transport }}
        run: |
          $package = if ($env:PACKAGE_TRANSPORT -eq 'github') { "github:xD-Mohamed/agent-presence#$env:PACKAGE_SHA" } else { "https://codeload.github.com/xD-Mohamed/agent-presence/tar.gz/$env:PACKAGE_SHA" }
          ./scripts/test-distribution.ps1 -Package $package
  windows-direct-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install without Node, npm, Git or npm cache
        shell: powershell
        env:
          PACKAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/test-bootstrap-install.ps1 -Revision $env:PACKAGE_SHA
